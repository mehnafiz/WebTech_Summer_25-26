<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission Form</title>
</head>

<body>
    <h1>Online Admission Form</h1>
    <section id="personal_info">
        <form>
            <fieldset>
                <legend>Personal Info</legend>
                <legend>Name:</legend>
                <input type="text" id="name" name="name" required><br />
                <legend>Email:</legend>
                <input type="email" id="email" name="email" required><br />
                <legend>Phone:</legend>
                <input type="tel" id="phone" name="phone" required><br />
                <legend>Gender:</legend>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
                <legend>Intrests:</legend>
                <input type="checkbox" id="reading" name="intrests" value="reading">
                <label for="reading">Reading</label>
                <input type="checkbox" id="traveling" name="intrests" value="traveling">
                <label for="traveling">Traveling</label>
                <input type="checkbox" id="sports" name="intrests" value="sports">
                <label for="sports">Sports</label>
                <legend>Course Selection:</legend>
                <select>
                    <option value="Cse">CSE</option>
                    <option value="Ece">ECE</option>
                    <option value="Mech">Mechanical</option>
                </select>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required><br />
            </fieldset>
        </form>
    </section>
    <section id="academic_info">
        <form>
            <fieldset>
                <legend>Academic Info</legend>
                <legend>High School:</legend>
                <input type="text" id="highschool" name="highschool" required><br />
                <legend>Intermediate:</legend>
                <input type="text" id="intermediate" name="intermediate" required><br />
                <legend>Graduation:</legend>
                <input type="text" id="graduation" name="graduation" required><br />
                <legend>Passing Year:</legend>
                <select>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </fieldset>
        </form>
    </section>
     <input type="submit" value="Submit">
     <input type="reset" value="Reset">
</body>

</html>
